name: ai_app_factory
description: مصنع التطبيقات - توليد وبناء تطبيقات Flutter (APK / Web) عبر GitHub Actions.
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  http: ^1.5.0
  shared_preferences: ^2.5.3
  path: ^1.9.1
  path_provider: ^2.1.5
  archive: ^3.6.1
  uuid: ^4.5.1
  yaml: ^3.1.3
  share_plus: ^11.0.0
  file_picker: ^10.1.0
  url_launcher: ^6.3.2
  flutter_foreground_task: 9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_square.png"
  adaptive_icon_background: "#4B4FD0"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21
